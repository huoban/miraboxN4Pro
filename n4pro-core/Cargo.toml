[package]
name = "n4pro-core"
version = "1.0.7"
edition = "2021"
description = "N4 Pro 按键屏重制版（只读配置 / 纯 HID / 无 UI）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
ureq = "2.12"

[profile.release]
# 由体积优先改为速度优先：PNG 编码/缩放是整页刷新与 Control Bar 拖动的热点路径
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
